<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sample Page</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Welcome to My Sample Page</h1>
    <p>Click a button below to change the page color theme.</p>

    <div class="buttons">
      <button class="btn blue" onclick="setTheme('blue')">Blue</button>
      <button class="btn green" onclick="setTheme('green')">Green</button>
      <button class="btn red" onclick="setTheme('red')">Red</button>
      <button class="btn purple" onclick="setTheme('purple')">Purple</button>
      <button class="btn orange" onclick="setTheme('orange')">Orange</button>
      <button class="btn dark" onclick="setTheme('dark')">Dark</button>
    </div>
  </main>

  <script>
    function setTheme(name) {
      document.body.setAttribute('data-theme', name);
      try { localStorage.setItem('theme', name); } catch (e) {}
    }

    try {
      var saved = localStorage.getItem('theme');
      if (saved) setTheme(saved);
    } catch (e) {}
  </script>
</body>
</html>
